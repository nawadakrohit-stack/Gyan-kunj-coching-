<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYAN KUNJ COACHING CENTER NAWADA - Tuition Management System</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --danger: #e63946;
            --whatsapp: #25d366;
            --dark: #1e1e24;
            --light: #f8f9fa;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .app-container { max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        
        /* Card Styling */
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .card-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; color: var(--dark); border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        /* Input Controls */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #666; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid #e0e0e0; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15); }
        
        /* Buttons */
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: white; width: 100%; justify-content: center; margin-top: 10px; }
        .btn-primary:hover { background: #3046c7; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .btn-success { background: var(--success); color: white; }
        .btn-whatsapp { background: var(--whatsapp); color: white; }
        .btn-whatsapp:hover { background: #1eb956; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }

        /* Search Section */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; }
        .search-box input { padding-left: 38px; }

        /* Student Record Card */
        .student-item { background: #fff; border: 1px solid #eef0f3; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .student-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .student-name { font-weight: 700; font-size: 1.1rem; color: var(--dark); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        
        .grid-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 0.85rem; background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .grid-info div span { display: block; color: #777; font-size: 0.75rem; }

        .history-list { font-size: 0.8rem; color: #555; max-height: 80px; overflow-y: auto; background: #fff; border-radius: 4px; padding: 6px; margin-bottom: 10px; border: 1px solid #eee; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Modal / Pop-up Box Styling */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-header { font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; }

        @media (max-width: 768px) { 
            .app-container { grid-template-columns: 1fr; } 
            .grid-info { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Registration Panel -->
    <div class="card">
        <div class="card-header"><i class="fa-solid fa-user-plus"></i> New Enrollment</div>
        
        <div class="form-group">
            <label>Student Full Name</label>
            <input type="text" id="sName" class="form-control" placeholder="e.g. Rohit Kumar">
        </div>
        <div class="form-group">
            <label>Father's Name</label>
            <input type="text" id="sFather" class="form-control" placeholder="e.g. Suresh Prasad">
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="sMobile" class="form-control" placeholder="e.g. 9876543210">
        </div>
        <div class="form-group">
            <label>Village / Address</label>
            <input type="text" id="sVillage" class="form-control" placeholder="e.g. Nawada">
        </div>
        <div class="form-group">
            <label>Joining Date</label>
            <input type="date" id="sDate" class="form-control">
        </div>
        <div class="form-group">
            <label>Total Monthly Fee (₹)</label>
            <input type="number" id="sTotal" class="form-control" placeholder="0.00">
        </div>
        <div class="form-group">
            <label>Initial Payment (₹)</label>
            <input type="number" id="sPaid" class="form-control" placeholder="0.00">
        </div>
        <div class="form-group">
            <label>Next Fee Due Date</label>
            <input type="date" id="sNextDate" class="form-control">
        </div>

        <button class="btn btn-primary" onclick="enrollStudent()"><i class="fa-solid fa-check"></i> Register Student</button>
    </div>

    <!-- Management Dashboard -->
    <div class="card">
        <div class="card-header"><i class="fa-solid fa-users"></i> Student Directory & Billing</div>
        
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchBar" class="form-control" onkeyup="renderDirectory()" placeholder="Search by student, father, or village name...">
        </div>

        <div id="directory"></div>
    </div>

</div>

<!-- Custom Modal for Adding Payment -->
<div class="modal-overlay" id="payModal">
    <div class="modal-content">
        <div class="modal-header"><i class="fa-solid fa-money-bill-wave"></i> Add Fee Payment</div>
        <input type="hidden" id="modalStudentId">
        
        <div class="form-group">
            <label>Payment Amount (₹)</label>
            <input type="number" id="mAmount" class="form-control" placeholder="Enter Amount">
        </div>
        <div class="form-group">
            <label>Payment Date</label>
            <input type="date" id="mPayDate" class="form-control">
        </div>
        <div class="form-group">
            <label>Next Fee Due Date</label>
            <input type="date" id="mNextDate" class="form-control">
        </div>

        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-success" style="flex:1;" onclick="submitPayment()">Submit</button>
            <button class="btn btn-outline" style="flex:1;" onclick="closePayModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem("gkCoachingDB")) || [];

    function enrollStudent() {
        const name = document.getElementById("sName").value.trim();
        const father = document.getElementById("sFather").value.trim();
        const mobile = document.getElementById("sMobile").value.trim();
        const village = document.getElementById("sVillage").value.trim();
        const date = document.getElementById("sDate").value;
        const total = parseFloat(document.getElementById("sTotal").value) || 0;
        const paid = parseFloat(document.getElementById("sPaid").value) || 0;
        const nextDate = document.getElementById("sNextDate").value || 'Not Set';

        if(!name || !date) {
            alert("Student Name and Joining Date are required!");
            return;
        }

        const student = {
            id: 'GK-' + Date.now().toString().slice(-5),
            name: name,
            father: father || 'N/A',
            mobile: mobile || 'N/A',
            village: village || 'N/A',
            date: date,
            total: total,
            paid: paid,
            nextDate: nextDate,
            ledger: paid > 0 ? [{ amount: paid, date: date }] : []
        };

        db.push(student);
        syncStorage();
        clearInputs();
        renderDirectory();
    }

    // Modal Functions
    function openPayModal(id) {
        document.getElementById("modalStudentId").value = id;
        document.getElementById("mAmount").value = "";
        
        // Auto-fill today's date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById("mPayDate").value = today;
        document.getElementById("mNextDate").value = "";
        
        document.getElementById("payModal").style.display = "flex";
    }

    function closePayModal() {
        document.getElementById("payModal").style.display = "none";
    }

    function submitPayment() {
        const id = document.getElementById("modalStudentId").value;
        const amt = parseFloat(document.getElementById("mAmount").value) || 0;
        const payDate = document.getElementById("mPayDate").value;
        const nextDate = document.getElementById("mNextDate").value;

        if (amt <= 0) {
            alert("Please enter a valid amount!");
            return;
        }

        const stu = db.find(s => s.id === id);
        if (stu) {
            stu.paid += amt;
            if (nextDate) stu.nextDate = nextDate;
            stu.ledger.push({
                amount: amt,
                date: payDate || new Date().toISOString().split('T')[0]
            });

            syncStorage();
            renderDirectory();
            closePayModal();
        }
    }

    function removeStudent(id) {
        if(confirm("Are you sure you want to delete this student record?")) {
            db = db.filter(s => s.id !== id);
            syncStorage();
            renderDirectory();
        }
    }

    function printReceipt(id) {
        const stu = db.find(s => s.id === id);
        const due = stu.total - stu.paid;
        const printWin = window.open('', '', 'width=650,height=500');
        printWin.document.write(`
            <html>
                <head><title>Fee Receipt - ${stu.name}</title></head>
                <body style="font-family:sans-serif; padding:30px;">
                    <h2 style="text-align:center; margin-bottom:5px;">GYAN KUNJ COACHING CENTER</h2>
                    <p style="text-align:center; margin-top:0; font-size:0.9rem; color:#555;">Nawada, Bihar</p>
                    <hr>
                    <p><strong>Receipt ID:</strong> ${stu.id}</p>
                    <p><strong>Student Name:</strong> ${stu.name}</p>
                    <p><strong>Father's Name:</strong> ${stu.father}</p>
                    <p><strong>Mobile:</strong> ${stu.mobile} | <strong>Village:</strong> ${stu.village}</p>
                    <p><strong>Date Joined:</strong> ${stu.date}</p>
                    <hr>
                    <p>Total Fee: ₹${stu.total}</p>
                    <p>Total Paid: ₹${stu.paid}</p>
                    <p><strong>Remaining Balance (Due): ₹${due}</strong></p>
                    <p><strong>Next Due Date: ${stu.nextDate}</strong></p>
                    <hr>
                    <p style="font-size: 0.8rem; color: #777; text-align:center;">Thank you for your payment!</p>
                </body>
            </html>
        `);
        printWin.document.close();
        printWin.focus();
        printWin.print();
    }

    function shareOnWhatsApp(id) {
        const stu = db.find(s => s.id === id);
        if (!stu) return;

        const due = stu.total - stu.paid;
        
        const message = 
`*GYAN KUNJ COACHING CENTER, NAWADA*
---------------------------------------
*Fee Details / Receipt*
---------------------------------------
👤 *Student:* ${stu.name}
👨‍👦 *Father:* ${stu.father}
🏡 *Village:* ${stu.village}
📅 *Joined:* ${stu.date}
---------------------------------------
💰 *Total Fee:* ₹${stu.total}
✅ *Paid Fee:* ₹${stu.paid}
❌ *Remaining Due:* ₹${due}
📆 *Next Due Date:* ${stu.nextDate}
---------------------------------------
Thank you!`;

        let cleanMobile = stu.mobile.replace(/[^0-9]/g, '');
        if (cleanMobile.length === 10) {
            cleanMobile = '91' + cleanMobile;
        }

        let whatsappUrl = "";
        if (cleanMobile.length >= 10) {
            whatsappUrl = `https://wa.me/${cleanMobile}?text=${encodeURIComponent(message)}`;
        } else {
            whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        }

        window.open(whatsappUrl, '_blank');
    }

    function renderDirectory() {
        const query = document.getElementById("searchBar").value.toLowerCase();
        const dir = document.getElementById("directory");
        dir.innerHTML = "";

        const matches = db.filter(s => 
            s.name.toLowerCase().includes(query) || 
            s.father.toLowerCase().includes(query) || 
            s.village.toLowerCase().includes(query)
        );

        if(matches.length === 0) {
            dir.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">No matching records found.</p>`;
            return;
        }

        matches.forEach(s => {
            const due = s.total - s.paid;
            const statusClass = due <= 0 ? 'badge-success' : 'badge-danger';
            const statusText = due <= 0 ? 'PAID' : 'DUE';

            let historyHtml = s.ledger.map(l => `<div>• ₹${l.amount} on ${l.date}</div>`).join('');

            dir.innerHTML += `
                <div class="student-item">
                    <div class="student-header">
                        <div>
                            <span class="student-name">${s.name}</span>
                            <span style="font-size:0.8rem; color:#555; display:block;">Father: ${s.father} | Mob: ${s.mobile}</span>
                            <span style="font-size:0.75rem; color:#888;">Village: ${s.village} | ID: ${s.id}</span>
                        </div>
                        <span class="badge ${statusClass}">${statusText}</span>
                    </div>

                    <div class="grid-info">
                        <div><span>Joined</span>${s.date}</div>
                        <div><span>Total Fee</span>₹${s.total}</div>
                        <div><span>Due Balance</span><strong style="color:${due > 0 ? 'var(--danger)' : 'var(--success)'}">₹${due}</strong></div>
                        <div><span>Last Paid</span>₹${s.paid}</div>
                        <div><span>Next Due Date</span><strong style="color:var(--primary);">${s.nextDate}</strong></div>
                    </div>

                    ${s.ledger.length > 0 ? `<div class="history-list"><strong>Payment History:</strong>${historyHtml}</div>` : ''}

                    <div class="actions">
                        <button class="btn btn-sm btn-success" onclick="openPayModal('${s.id}')"><i class="fa-solid fa-plus"></i> Pay Fee</button>
                        <button class="btn btn-sm btn-whatsapp" onclick="shareOnWhatsApp('${s.id}')"><i class="fa-brands fa-whatsapp"></i> Share</button>
                        <button class="btn btn-sm btn-outline" onclick="printReceipt('${s.id}')"><i class="fa-solid fa-print"></i> Receipt</button>
                        <button class="btn btn-sm btn-danger" onclick="removeStudent('${s.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function syncStorage() {
        localStorage.setItem("gkCoachingDB", JSON.stringify(db));
    }

    function clearInputs() {
        document.getElementById("sName").value = "";
        document.getElementById("sFather").value = "";
        document.getElementById("sMobile").value = "";
        document.getElementById("sVillage").value = "";
        document.getElementById("sDate").value = "";
        document.getElementById("sTotal").value = "";
        document.getElementById("sPaid").value = "";
        document.getElementById("sNextDate").value = "";
    }

    // Initial Load
    renderDirectory();
</script>

</body>
</html>
